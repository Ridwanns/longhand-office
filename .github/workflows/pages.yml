name: Publish working Office
# Public source/market data only; private records remain in visitors' browsers.
on:
  workflow_dispatch:
    inputs:
      interface_only:
        description: Publish code against the preceding verified public data, preserving original source dates
        type: boolean
        required: false
        default: false
      us_tickers:
        description: Additional US equities/ETFs, separated by commas
        required: false
        default: ''
      idx_tickers:
        description: Additional IDX tickers, separated by commas
        required: false
        default: ''
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  interface:
    if: github.event_name == 'workflow_dispatch' && inputs.interface_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          check-latest: true
      - run: node scripts/node-security.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: true
      - run: npm test
      - run: python tests/public-snapshot-cache.py && python tests/interface-snapshot.py
      - name: Restore only public data from the preceding successful full Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          officeRunId=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          test -n "$officeRunId" && test "$officeRunId" != "null"
          gh run download "$officeRunId" --repo "$GITHUB_REPOSITORY" --name github-pages --dir .tools/interface-public-cache
          python scripts/reuse-interface-snapshot.py .tools/interface-public-cache/artifact.tar
          echo "::notice::Interface release uses verified public run $officeRunId. Original source acquisition times are unchanged."
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/office
      - name: Deploy working Office
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.interface_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          check-latest: true
      - run: node scripts/node-security.mjs
      - run: npm test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: true
      - run: python tests/atlas-parity.py -v
      - run: python tests/research-reference.py
      - run: python tests/public-snapshot-cache.py
      - run: python tests/macro-retention.py
      - run: python -m pip install --upgrade 'pip>=26.2.2'
      - run: python -m pip install --only-binary=:all: -r requirements-data.txt
      - run: python scripts/audit-python-dependencies.py
      - run: python scripts/yahoo-stock-directory.py
        id: directory
        continue-on-error: true
      - run: python tests/valuation-cashflows.py
      - run: python scripts/collect-valuation-cashflows.py
        if: steps.directory.outcome == 'success'
        env:
          OFFICE_US_TICKERS: ${{ inputs.us_tickers }}
          OFFICE_IDX_TICKERS: ${{ inputs.idx_tickers }}
      - run: node scripts/pages-data.mjs
        if: steps.directory.outcome == 'success'
        env:
          OFFICE_US_TICKERS: ${{ inputs.us_tickers }}
          OFFICE_IDX_TICKERS: ${{ inputs.idx_tickers }}
      - name: Reuse verified public data for an interface release when the provider is unavailable
        if: github.event_name == 'push' && steps.directory.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          officeRunId=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          test -n "$officeRunId" && test "$officeRunId" != "null"
          gh run download "$officeRunId" --repo "$GITHUB_REPOSITORY" --name github-pages --dir .tools/public-pages-cache
          python scripts/reuse-public-snapshot.py .tools/public-pages-cache/artifact.tar
          echo "::warning::Yahoo catalogue unavailable. This interface release retains public data from verified run $officeRunId with its original source timestamps."
      - run: node scripts/verify-valuation-data.mjs
      - run: node scripts/verify-advanced-publication.mjs
      - run: node scripts/verify-pages-universe.mjs
      - run: node scripts/official-rates-data.mjs
      - name: Retain complete public market histories before refreshing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for officeRunId in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?status=success&per_page=5" --jq '.workflow_runs[].id'); do
            officeCacheDir=".tools/market-history-cache/$officeRunId"
            if gh run download "$officeRunId" --repo "$GITHUB_REPOSITORY" --name github-pages --dir "$officeCacheDir" && python scripts/retain-market-history.py "$officeCacheDir/artifact.tar"; then
              python scripts/source-baseline.py "$officeCacheDir/artifact.tar"
              echo "Retained complete public history from run $officeRunId with its original source dates."
              break
            fi
          done
      - run: node scripts/market-history-data.mjs
        env:
          OFFICE_REQUIRE_COMPLETE_HISTORY: '1'
      - run: node scripts/fx-history-data.mjs
      - run: node scripts/macro-data.mjs
      - run: node scripts/macro-context-data.mjs
      - run: node scripts/macro-releases-data.mjs
      - run: node scripts/macro-indicators-data.mjs
      - run: node scripts/macro-extended-data.mjs
      - name: Retain independently audited macro series when a source refresh fails
        run: node scripts/retain-macro-data.mjs
      - run: python scripts/audit-macro-extended.py
      - run: node scripts/verify-macro-outlook.mjs
      - run: python scripts/audit-macro-outlook.py
      - run: node scripts/sec-fundamentals.mjs
        env:
          OFFICE_US_TICKERS: ${{ inputs.us_tickers }}
          OFFICE_SEC_USER_AGENT: ${{ vars.OFFICE_SEC_USER_AGENT }}
      - name: Reconcile public vintages and reacquire reviewed issuer filings
        run: node scripts/source-integrity-data.mjs
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/office
      - name: Deploy working Office
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
