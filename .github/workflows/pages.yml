name: Publish working Office
# Public source/market data only; private records remain in visitors' browsers.
on:
  workflow_dispatch:
    inputs:
      us_tickers:
        description: Additional US equities/ETFs, separated by commas
        required: false
        default: ''
      idx_tickers:
        description: Additional IDX tickers, separated by commas
        required: false
        default: ''
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/pages-data.mjs
        env:
          OFFICE_US_TICKERS: ${{ inputs.us_tickers }}
          OFFICE_IDX_TICKERS: ${{ inputs.idx_tickers }}
      - run: node scripts/verify-pages-universe.mjs
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/office
      - name: Deploy working Office
        id: deployment
        uses: actions/deploy-pages@v5
