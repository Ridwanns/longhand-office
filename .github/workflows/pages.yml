name: Publish public design preview
# Deliberately manual: pushing private application source does not publish it.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
      - name: Deploy design preview
        id: deployment
        uses: actions/deploy-pages@v5
