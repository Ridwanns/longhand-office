name: Refresh native market prices
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish working Office]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '3-59/5 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: native-price-refresh
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      site_run: ${{ steps.ready.outputs.site_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          check-latest: true
      - run: node scripts/node-security.mjs
      - name: Retain the newest verified site without rebuilding its models
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-prices-site.mjs restore
      - name: Acquire exact source prices for the complete published catalogue
        if: steps.source.outputs.ready == 'true'
        run: node scripts/native-prices-data.mjs dist/office/data
      - name: Check release identity and give interface releases priority
        id: ready
        if: steps.source.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-prices-site.mjs check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.ready.outputs.ready == 'true'
        with:
          path: dist/office
  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Do not join the interface concurrency group: a scheduled price run must
    # never evict a pending interface deployment. Final checks give it priority.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          check-latest: true
      - run: node scripts/node-security.mjs
      - name: Recheck current main revision before publishing
        id: final
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICE_PRICE_SOURCE_RUN: ${{ needs.prepare.outputs.site_run }}
        run: node scripts/native-prices-site.mjs final
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        if: steps.final.outputs.ready == 'true'
        id: deployment
